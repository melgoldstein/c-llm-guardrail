[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c-llm-guardrail"
version = "0.1.0"
description = "c llm guardrail developer toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
guardrail = "guardrail_py.cli:main"

[project.urls]
Repository = "https://github.com/melgoldstein/c-llm-guardrail"
Issues = "https://github.com/melgoldstein/c-llm-guardrail/issues"

[tool.setuptools]
packages = ["guardrail_py", "guardrail_py.native"]

[tool.setuptools.package-data]
guardrail_py = ["native/*.c", "native/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
